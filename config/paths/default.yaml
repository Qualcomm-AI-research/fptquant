# @package paths
#
# The default resources are Hugging Face repository IDs. Transformers and
# Datasets download them on first use and reuse ``cache.local`` afterwards.
# Replace a model ID with a local snapshot path to run offline.

cache:
  # null delegates cache placement to Hugging Face (for example ~/.cache/huggingface).
  local: null

log: outputs

resources:
  llms:
    llama_v32_1B_instruct: meta-llama/Llama-3.2-1B-Instruct
    llama_v32_3B_instruct: meta-llama/Llama-3.2-3B-Instruct
    llama_v3_8B: meta-llama/Meta-Llama-3-8B

  datasets:
    wikitext: Salesforce/wikitext
